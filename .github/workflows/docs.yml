name: Docs

on:
  push:
    branches: [main]
    paths: [docs/**, site/**, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated reads git history
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - uses: actions/configure-pages@v5
      - run: pnpm --dir site install --frozen-lockfile
      # kanbot.mib.im documents the latest release, so it matches what npm installs.
      - name: Check out the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          git worktree add "$RUNNER_TEMP/release" "$tag"
          # The changelog is site content, not versioned docs.
          cp docs/changelog.md "$RUNNER_TEMP/release/docs/"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build release docs
        run: pnpm --dir site build && mv site/.vitepress/dist _site
        env:
          DOCS_CHANNEL: release
          DOCS_DIR: ${{ runner.temp }}/release/docs
          DOCS_VERSION: ${{ steps.release.outputs.tag }}
          DOCS_BASE: /
          DOCS_URL: https://kanbot.mib.im
          GITHUB_TOKEN: ${{ github.token }}
      # kanbot.mib.im/main/ documents unreleased changes.
      - name: Build main docs
        run: pnpm --dir site build && mv site/.vitepress/dist _site/main
        env:
          DOCS_CHANNEL: main
          DOCS_BASE: /main/
          DOCS_URL: https://kanbot.mib.im/main
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
